{% extends 'base.html' %}
{% block title %}Новый вопрос · Почему онлайн{% endblock %}
{% block content %}
  <div class="mb-5"><h1 class="fs-2">Новый вопрос</h1></div>
  <div class="mb-2"><span class="text-danger">Не указан ни один тег</span></div>
  <form method="post">{% csrf_token %}
    <div class="row g-3 align-items-start mb-3">
      <div class="col-12 col-sm-2"><label for="inputtitle" class="col-form-label">Заголовок</label></div>
      <div class="col-12 col-sm-8"><input type="text" id="inputtitle" name="title" maxlength="150" class="form-control" title="Введите заголовок вопроса"></div>
    </div>
    <div class="row g-3 align-items-start mb-3">
      <div class="col-12 col-sm-2"><label for="question-text" class="col-form-label">Текст вопроса</label></div>
      <div class="col-12 col-sm-8"><textarea class="form-control" id="question-text" name="text" rows="12" title="Введите текст вопроса"></textarea></div>
    </div>
    <div class="row g-3 align-items-start mb-3">
      <div class="col-12 col-sm-2"><label for="question-tags" class="col-form-label">Теги</label></div>
      <div class="col-12 col-sm-8"><input type="text" id="question-tags" name="tags" class="form-control" title="Введите теги вопроса"></div>
    </div>
    <div class="row g-3 align-items-start mb-3">
      <div class="d-none d-sm-block col-sm-2"></div>
      <div class="col-12 col-sm-7"><button type="submit" class="btn btn-primary mb-1">Озадачиться</button></div>
    </div>
  </form>
{% endblock %}
