{% load static %}
<div class="row mb-3 bg-light p-3 d-flex card-body">
  <div class="col-3 col-sm-2">
    {% include 'questions/includes/avatar.html' with author=question.author only %}
    <div class="d-flex flex-column">
      <button class="btn btn-primary" type="button">{{ question.score }} ♥</button>
    </div>
  </div>
  <div class="col-9 col-sm-10 d-flex flex-column">
    <h2 class="h5 card-title mb-3"><a href="{{ question.get_absolute_url }}">{{ question.title }}</a></h2>
    <p class="card-text">{{ question.text }}</p>
    <div class="row mt-auto">
      <div class="col-12 col-sm-5"><a href="{{ question.get_absolute_url }}" class="card-link">Ответы: {{ question.answers_count }}</a></div>
      <div class="col-12 col-sm-5">
        <span>Тег: </span>
        {% for tag in question.tags.all %}<a href="{{ tag.get_absolute_url }}" class="card-link">{{ tag.name }}</a>{% empty %}—{% endfor %}
      </div>
    </div>
  </div>
</div>
