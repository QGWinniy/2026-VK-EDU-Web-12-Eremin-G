services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:6767
    ports:
      - "127.0.0.1:6767:6767"
    volumes:
      - .:/app
    env_file: .env.docker
    environment:
      DJANGO_ENV_FILE: .env.docker
      DJANGO_DEBUG_TOOLBAR_DOCKER: "1"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    env_file: .env.docker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
